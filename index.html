    <title>Blush Planner — Personal Command Center</title>
    <meta name="description" content="Personal productivity and life-management command center for Bac 2027, German & Ausbildung, software projects, habits, unified calendar, and daily focus." />
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          for (var r of regs) r.unregister();
        });
      }
      if ('caches' in window) {
        caches.keys().then(function(names) {
          for (var n of names) caches.delete(n);
        });
      }
    </script>
